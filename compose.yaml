name: table-por-test
services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:15432:5432"
    environment:
      POSTGRES_DB: tablepor_test
      POSTGRES_USER: fixture_admin
      POSTGRES_PASSWORD: local-fixture-admin
    volumes:
      - ./tests/fixtures/postgres.sql:/docker-entrypoint-initdb.d/01-fixture.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fixture_admin -d tablepor_test"]
      interval: 2s
      timeout: 3s
      retries: 15
    tmpfs:
      - /var/lib/postgresql/data
  mysql:
    image: mysql:8.4
    ports:
      - "127.0.0.1:13306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: local-mysql-admin
      MYSQL_DATABASE: tablepor_test
    volumes:
      - ./tests/fixtures/mysql.sql:/docker-entrypoint-initdb.d/01-fixture.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -plocal-mysql-admin --silent"]
      interval: 3s
      timeout: 3s
      retries: 40
    tmpfs:
      - /var/lib/mysql
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--aclfile", "/etc/redis/users.acl"]
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - ./tests/fixtures/redis.acl:/etc/redis/users.acl:ro
    healthcheck:
      test: ["CMD", "redis-cli", "--user", "fixture_admin", "-a", "local-redis-admin", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
