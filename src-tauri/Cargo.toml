[package]
name = "buggy-table"
version = "0.1.17"
description = "A local database workspace with guarded queries and explicit table saves"
edition = "2024"
rust-version = "1.90"
publish = false

[lib]
name = "table_por"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "buggy-table"
path = "src/main.rs"
required-features = ["desktop"]

[features]
vpn-integration = []
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-updater", "dep:tauri-plugin-opener", "dep:keyring-core", "dep:apple-native-keyring-store", "dep:windows-native-keyring-store"]

[build-dependencies]
tauri-build = { version = "2.7", features = [], optional = true }

[dependencies]
tauri = { version = "2.12", features = [], optional = true }
tauri-plugin-updater = { version = "2.13.3", optional = true }
tauri-plugin-opener = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "process"] }
tokio-postgres = "0.7"
postgres-native-tls = "0.5"
native-tls = "0.2"
tokio-native-tls = "0.3"
futures-util = "0.3"
sqlparser = "0.61"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
mysql_async = { version = "0.37.1", default-features = false, features = ["minimal-rust", "native-tls-tls"] }
redis = { version = "1.7.1", default-features = false, features = ["tokio-native-tls-comp"] }

keyring-core = { version = "1.0.1", optional = true }
tempfile = "3"
aes-gcm = "0.10.3"
sha2 = "0.10"
shlex = "1.3"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { version = "1.1.0", default-features = false, optional = true }

[dev-dependencies]
rcgen = "0.14.10"
base64 = "0.23"
minisign-verify = "0.3"

[[test]]
name = "vpn_integration"
path = "tests/vpn_integration.rs"
required-features = ["vpn-integration"]

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"
