name: Build test installers
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'native/**'
      - 'scripts/build-vpn.py'
      - '.github/actions/build-vpn/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'scripts/verify-macos-bundle.sh'
      - '.github/workflows/installers.yml'
concurrency:
  group: installers-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: mac-arm64
            bundles: app,dmg
          - os: macos-15-intel
            platform: mac-intel
            bundles: app,dmg
          - os: windows-latest
            platform: windows-x64
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/build-vpn
      - run: pnpm tauri build --bundles ${{ matrix.bundles }}
      - name: Verify macOS bundle and packaged app
        if: runner.os == 'macOS'
        run: bash scripts/verify-macos-bundle.sh src-tauri/target/release/bundle preview
      - name: Verify installed Windows VPN engine
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify-windows-bundle.ps1 src-tauri/target/release/bundle
      - uses: actions/upload-artifact@v4
        with:
          name: TEST-ONLY-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
