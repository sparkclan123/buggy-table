name: Build signed release
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing source tag, e.g. v0.1.0'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: signed-release
  cancel-in-progress: false

jobs:
  build:
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            platform: darwin-aarch64
            bundles: app,dmg
          - os: macos-15-intel
            target: x86_64-apple-darwin
            platform: darwin-x86_64
            bundles: app,dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            bundles: nsis
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/build-vpn
      - run: node scripts/version.mjs --check
      - run: rustup target add ${{ matrix.target }}
      - run: pnpm check
      - run: pnpm test
      - run: node --test scripts/release-assets.test.mjs
      - run: pnpm test:rust
      - run: pnpm lint:rust
      - name: Install Azure signing client
        if: runner.os == 'Windows'
        run: cargo install artifact-signing-cli --version 0.11.0 --locked
      - name: Validate signing configuration and build
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
        run: |
          node scripts/prepare-signing.mjs
          pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config src-tauri/tauri.release.conf.json --config src-tauri/tauri.signing.conf.json
      - name: Verify macOS signature and notarization
        if: runner.os == 'macOS'
        run: bash scripts/verify-macos-bundle.sh "src-tauri/target/${{ matrix.target }}/release/bundle" signed
      - name: Verify Windows signatures
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $files = @("src-tauri/target/${{ matrix.target }}/release/buggy-table.exe") + @(Get-ChildItem "src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe" | ForEach-Object FullName)
          foreach ($file in $files) {
            if ((Get-AuthenticodeSignature $file).Status -ne 'Valid') { throw "Invalid Authenticode signature: $file" }
          }
      - run: node scripts/release-assets.mjs collect ${{ matrix.platform }} src-tauri/target/${{ matrix.target }}/release/bundle artifacts/${{ matrix.platform }}
      - run: cargo run --manifest-path src-tauri/Cargo.toml --no-default-features --example verify_release -- artifacts/${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: signed-${{ matrix.platform }}
          path: artifacts/${{ matrix.platform }}/*
          if-no-files-found: error
          retention-days: 14

  draft:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: signed-*
          path: release-assets
          merge-multiple: true
      - run: node scripts/version.mjs --check
      - run: node scripts/release-assets.mjs manifest release-assets
      - name: Create complete draft in distribution repository
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          test -n "$GH_TOKEN"
          gh release create "$RELEASE_TAG" release-assets/*.dmg release-assets/*.exe release-assets/*.gz release-assets/*.sig release-assets/latest.json release-assets/SHA256SUMS.txt --repo sparkclan123/buggy-table-releases --target main --title "buggy-table $RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md --draft
