name: Check
on: [push, pull_request]

concurrency:
  group: check-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  vpn-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: ./.github/actions/build-vpn
      - run: python3 scripts/vpn-fixtures.py start
      - run: python3 scripts/test-vpn-engine.py src-tauri/binaries/buggy-vpn-x86_64-unknown-linux-gnu
      - run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --features vpn-integration --test vpn_integration -- --ignored --nocapture
      - if: always()
        run: python3 scripts/vpn-fixtures.py stop

  postgres-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ['15', '16', '17', '18']
    env:
      BUGGY_TEST_POSTGRES_VERSION: ${{ matrix.postgres }}
      BUGGY_TEST_POSTGRES_PORT: '25432'
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: docker compose -p buggy-pg-compat -f tests/compose.postgres-compat.yml up -d --wait
      - run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --test postgres_integration -- --include-ignored --test-threads=1
      - run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --lib encrypted_connection_authenticates_and_queries_through_tls -- --ignored
      - if: failure()
        run: docker compose -p buggy-pg-compat -f tests/compose.postgres-compat.yml logs
      - if: always()
        run: docker compose -p buggy-pg-compat -f tests/compose.postgres-compat.yml down

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: rustup show
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/build-vpn
      - run: pnpm check
      - run: pnpm test
      - run: pnpm format:check
      - run: pnpm test:rust
      - run: pnpm lint:rust
      - if: runner.os == 'Windows'
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib local_credential_roundtrip -- --ignored
      - run: pnpm tauri build --debug --no-bundle

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: rustup show
      - run: pnpm install --frozen-lockfile
      - run: docker compose up -d --wait
      - run: pnpm test:integration
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm test:ui
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-failure-traces
          path: test-results/
          retention-days: 7
      - if: always()
        run: docker compose down
