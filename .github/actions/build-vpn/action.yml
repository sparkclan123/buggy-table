name: Build bundled VPN
description: Build a static OpenVPN/lwIP engine; no Docker dependency in the installed app
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install native build tools (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: brew install cmake
    - name: Install native build tools (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y cmake build-essential perl
    - uses: ilammy/msvc-dev-cmd@v1
      if: runner.os == 'Windows'
    - uses: ilammy/setup-nasm@v1
      if: runner.os == 'Windows'
    - name: Use native Windows Perl
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $perl = 'C:/Strawberry/perl/bin'
        if (!(Test-Path "$perl/perl.exe")) { choco install strawberryperl --yes --no-progress }
        if (!(Test-Path "$perl/perl.exe")) { throw 'Native Windows Perl is required to build OpenSSL' }
        $perl >> $env:GITHUB_PATH
    - uses: actions/cache/restore@v4
      id: openssl-cache
      with:
        path: artifacts/native-vpn/openssl-install
        key: vpn-crypto-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/vpn/deps.json', 'scripts/build-vpn.py') }}
    - name: Build and verify bundled engine (Unix)
      if: runner.os != 'Windows'
      shell: bash
      run: python scripts/build-vpn.py
    - name: Build and verify bundled engine (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: python scripts/build-vpn.py
    - uses: actions/cache/save@v4
      if: always() && steps.openssl-cache.outputs.cache-hit != 'true' && hashFiles('artifacts/native-vpn/openssl-install/.built-identity') != ''
      with:
        path: artifacts/native-vpn/openssl-install
        key: vpn-crypto-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/vpn/deps.json', 'scripts/build-vpn.py') }}
