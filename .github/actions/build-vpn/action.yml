name: Build bundled VPN
description: Build a static OpenVPN/lwIP engine; no Docker dependency in the installed app
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install native build tools (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: brew install cmake openssl@3
    - name: Install native build tools (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y cmake libssl-dev
    - name: Identify Windows crypto build cache
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $revision = git -C $env:VCPKG_INSTALLATION_ROOT rev-parse HEAD
        "VPN_OPENSSL_CACHE=$env:VCPKG_INSTALLATION_ROOT/installed" >> $env:GITHUB_ENV
        "VPN_OPENSSL_CACHE_KEY=vpn-openssl-$revision-$env:ImageVersion" >> $env:GITHUB_ENV
    - uses: actions/cache/restore@v4
      id: openssl-cache
      if: runner.os == 'Windows'
      with:
        path: ${{ env.VPN_OPENSSL_CACHE }}
        key: ${{ env.VPN_OPENSSL_CACHE_KEY }}
    - name: Build static OpenSSL (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install openssl:x64-windows-static
        if ($LASTEXITCODE -ne 0) { throw 'Static OpenSSL build failed' }
        "OPENSSL_ROOT_DIR=$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows-static" >> $env:GITHUB_ENV
    - uses: actions/cache/save@v4
      if: runner.os == 'Windows' && steps.openssl-cache.outputs.cache-hit != 'true'
      with:
        path: ${{ env.VPN_OPENSSL_CACHE }}
        key: ${{ env.VPN_OPENSSL_CACHE_KEY }}
    - name: Build and verify bundled engine
      shell: bash
      run: python scripts/build-vpn.py
